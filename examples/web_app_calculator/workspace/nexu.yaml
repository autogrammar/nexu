version: nexu.v1
project:
  name: workspace
  source_of_truth:
    intent: intract.yaml
    capsules: .nexu/capsules
    snapshots: .nexu/snapshots
verification:
  fail_on:
  - forbidden_effect
  - invalid_contract
  warn_on:
  - missing_tests
  - partial_output_match
llm:
  provider: openrouter
  model: openrouter/deepseek/deepseek-v4-pro
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.1
  allow_network_calls: true
cinema:
  # Live Cinema /iterate tuning (overridable via CINEMA_* env vars)
  markpact_context_chars: 4000   # max Markpact markdown in LLM prompt (summary mode)
  markpact_context_mode: summary # summary | full | off
  html_context_chars: 8000       # max current stage HTML in prompt
  max_tokens: 4096               # per-call output cap (batch uses max(..., 8192))
  option_generation_mode: batch  # batch (1 call for A-C) | parallel (3 calls)
  llm_trace_keep: 80             # retained exchanges in LLM debug tab
orchestration:
  default_steps: 10
  llm_mode: offline
  require_verification_after_each_step: true
mcp:
  enabled: true
  transport: stdio
  allow_apply: false
review:
  require_human_approval: true
  evidence_required: true
  fail_on:
  - fail
  warn_on:
  - partial
  - warn
preview:
  default_horizon: 10
  render:
  - text_wireframe
  - ui_blueprint
