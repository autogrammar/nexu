<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; transition: all 0.3s ease; }
h1 { font-size: 20px; margin: 0 0 15px 0; color: #38bdf8; font-weight: 600; }
.stat { font-size: 14px; color: #94a3b8; margin: 10px 0; display: flex; justify-content: space-between; }
.value { color: #f8fafc; font-weight: bold; }
.badge { background: #10b981; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
.notifications { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
h3 { font-size: 14px; margin: 0 0 10px 0; color: #94a3b8; font-weight: 500; }
.notification-item { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; display: flex; align-items: center; gap: 8px; color: #fca5a5; }
.notification-item.info { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.2); color: #93c5fd; }
</style>
</head>
<body>
<div class="card">
  <h1>System Dashboard (S2)</h1>
  <div class="stat"><span>Status:</span> <span class="badge">Healthy</span></div>
  <div class="stat"><span>CPU Usage:</span> <span class="value">32.5%</span></div>
  <div class="stat"><span>Free Memory:</span> <span class="value">8.4 GB</span></div>
  <div class="notifications">
    <h3>Active Notifications</h3>
    <div class="notification-item">⚠️ High memory warning</div>
    <div class="notification-item info">ℹ️ Weekly report available</div>
  </div>
</div>
</body>
</html>
