<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 340px; }
h2 { text-align: center; margin-top: 0; font-size: 20px; color: #38bdf8; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
th { color: #38bdf8; }
</style>
</head>
<body>
<div class="card">
  <h2>Raw Database Logs (S0)</h2>
  <table>
    <tr><th>ID</th><th>User</th><th>Action</th><th>Status</th></tr>
    <tr><td>#102</td><td>Alice</td><td>Login</td><td>Success</td></tr>
    <tr><td>#103</td><td>Bob</td><td>Purchase</td><td>Success</td></tr>
    <tr><td>#104</td><td>Charlie</td><td>API Call</td><td>Failed</td></tr>
  </table>
</div>
</body>
</html>
