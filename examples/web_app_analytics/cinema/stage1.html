<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 340px; }
h2 { text-align: center; margin-top: 0; font-size: 20px; color: #fbbf24; }
.skeleton-chart { height: 120px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-top: 20px; position: relative; overflow: hidden; }
.skeleton-chart::after { content: ""; display: block; position: absolute; left: -150px; top: 0; height: 100%; width: 150px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent); animation: loading 1.5s infinite; }
@keyframes loading { 0% { left: -150px; } 100% { left: 100%; } }
.status { color: #fbbf24; text-align: center; font-size: 12px; margin-top: 25px; }
</style>
</head>
<body>
<div class="card">
  <h2>Analytics Dashboard (S1 Compile)</h2>
  <div class="skeleton-chart"></div>
  <div class="status">🔄 Compiling query schema & charts...</div>
</div>
</body>
</html>
