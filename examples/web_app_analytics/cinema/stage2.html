<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 340px; }
h2 { text-align: center; margin-top: 0; font-size: 20px; color: #2ecc71; }
.chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 120px; margin-top: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
.bar { width: 30px; background: linear-gradient(to top, #38bdf8, #818cf8); border-radius: 6px 6px 0 0; animation: grow 0.8s ease-out; }
@keyframes grow { from { height: 0; } }
.status { color: #2ecc71; text-align: center; font-size: 12px; margin-top: 25px; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h2>Analytics Dashboard (S2 Ready)</h2>
  <div class="chart-container">
    <div class="bar" style="height: 40%;"></div>
    <div class="bar" style="height: 85%;"></div>
    <div class="bar" style="height: 60%;"></div>
  </div>
  <div class="status">✅ Intract Query Policy verified!</div>
</div>
</body>
</html>
